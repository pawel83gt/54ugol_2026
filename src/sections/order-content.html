<main class="wrap">
    <div >
        <h1>Ваш заказ</h1>
        <p id="order-empty" hidden>Корзина пуста. <a href="/">Вернуться к выбору угля</a></p>
        <ul id="order-breakdown"></ul>
        <p>Итого: <strong id="order-total">0 ₽</strong></p>

        <form id="order-form">
            <label>Имя <input id="order-name" type="text" required></label>
            <label>Телефон <input id="order-phone" type="tel" required></label>
            <button class="btn" id="order-submit" type="submit">Отправить</button>
        </form>
        <p id="order-status" aria-live="polite"></p>
    </div>
</main>
