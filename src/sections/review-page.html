<main class="wrap">
    <div>
        <div class="review-head">
            <h1>Ваш отзыв</h1>
            <p>Здесь вы можете написать и отправить отзыв о работе нашей компании.</p>
        </div>
        <form id="review-form">
            <label>Имя <input id="review-name" type="text" required></label>
            <label>Телефон <input id="review-phone" type="tel" required></label>
            <label>Текст отзыва <textarea id="review-text" name="review-text" rows="5" required> </textarea></label>
            <button class="btn" id="review-submit" type="submit">Отправить</button>
        </form>
        <p id="review-status" aria-live="polite"></p>
    </div>
</main>
