<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа - ОСП Карасукский райтоп</title>
</head>

<body>
    <main>
        <h1>Ваш заказ</h1>
        <a href="/">главная</a>
        <p id="order-empty" hidden>Корзина пуста. <a href="/">Вернуться к выбору угля</a></p>
        <ul id="order-breakdown"></ul>
        <p>Итого: <strong id="order-total">0 ₽</strong></p>

        <form id="order-form">
            <label>Имя <input id="order-name" type="text" required></label>
            <label>Телефон <input id="order-phone" type="tel" required></label>
            <button id="order-submit" type="submit">Отправить</button>
        </form>
        <p id="order-status" aria-live="polite"></p>
    </main>

    <script type="module" src="/src/order-main.ts"></script>
</body>

</html>
